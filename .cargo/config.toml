[env]
FFMPEG_DIR = { value = ".deps/ffmpeg", relative = true }

# ts-rs writes the TypeScript wire types here during `cargo test`. The renderer
# imports them through `shared/desktop/dto.ts`, which re-exports them and adds
# nothing of its own — see that file's header and spec §10.9.
#
# `TS_RS_LARGE_INT` matters: without it `i64`/`u64` become `bigint`, and every
# tick, byte count and duration on the wire is one of those. They arrive as JSON
# numbers, so `number` is what they actually are.
TS_RS_EXPORT_DIR = { value = "apps/web/src/shared/desktop/generated", relative = true }
TS_RS_LARGE_INT = "number"
