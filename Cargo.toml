[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/demo-worker",
  "crates/application",
  "crates/agent",
  "crates/cosmetics",
  "crates/demo",
  "crates/domain",
  "crates/hlae",
  "crates/integrations",
  "crates/media",
  "crates/platform-windows",
  "crates/recording",
  "crates/runtime",
  "crates/source-assets",
  "crates/storage",
]
default-members = ["apps/desktop/src-tauri"]
exclude = [
  "vendor/demoparser/csgoproto",
  "vendor/demoparser/parser",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Vibe CS contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
ahash = "0.8.12"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "macros", "multipart", "ws"] }
bzip2 = "0.6.1"
bytes = "1.12.1"
cap-std = "4.0.3"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
dunce = "1.0.5"
ez-ffmpeg = "0.19.3"
# ez-ffmpeg 0.19 uses ffmpeg-sys-next 8.1; Cargo permits one native FFmpeg link.
ffmpeg-next = "=8.1.0"
futures-util = "0.3.34"
fs4 = { version = "1.1.0", features = ["sync"] }
getrandom = "0.4.3"
hex = "0.4.3"
http = "1.5.0"
lz4_flex = "0.14.0"
mime_guess = "2.0.5"
notify = "8.2.0"
png = "0.18.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rig-agent = { version = "0.45.0", default-features = false }
rig-core = { version = "0.45.0", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { version = "0.45.0", default-features = false, features = ["rustls"] }
rustfft = "6.4.1"
semver = "1.0.28"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "chrono"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
steamlocate = "2.1.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl", "format", "no-serde-warnings"] }
texture2ddecoder = "0.1.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
walkdir = "2.5.0"
winreg = "0.56.0"
windows = "0.62.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.101.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
