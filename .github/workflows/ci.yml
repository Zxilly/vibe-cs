name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-ffmpeg-sdk.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File vendor/demoparser/verify-manifest.ps1
      - run: cargo test --manifest-path vendor/demoparser/parser/Cargo.toml --lib
      - run: cargo test --manifest-path vendor/demoparser/csgoproto/Cargo.toml
      - run: cargo check --manifest-path vendor/demoparser/parser/Cargo.toml --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-rust-format.ps1
      - name: ts-rs binding configuration is accurate and quiet
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-ts-binding-config.ps1
      - name: generate TypeScript bindings with one Windows writer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-ts-bindings.ps1
      - name: wire types are in step with the Rust
        shell: bash
        run: |
          git add --intent-to-add -- apps/web/src/shared/desktop/generated/
          if ! git diff --exit-code -- apps/web/src/shared/desktop/generated/; then
            echo
            echo "The Rust structures changed and the checked-in TypeScript bindings did not."
            echo "Run 'pnpm bindings' locally, then commit the changes under"
            echo "apps/web/src/shared/desktop/generated/ together with the Rust change."
            echo "Never edit a file in that directory by hand: the next binding run overwrites it."
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `.cargo/config.toml` redirects normal ts-rs export tests to the ignored
      # workspace target directory. Only `pnpm bindings` writes the contract.
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap-ffmpeg-sdk.ps1
      - run: cargo test -p vibe-cs-agent
      - run: pnpm demo-worker:sidecar
      - run: cargo test -p vibe-cs-desktop published_demo_worker_matches_the_build_manifest -- --ignored --nocapture
      - run: pnpm desktop:build
