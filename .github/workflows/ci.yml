name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File vendor/demoparser/verify-manifest.ps1
      - run: cargo test --manifest-path vendor/demoparser/parser/Cargo.toml --lib
      - run: cargo test --manifest-path vendor/demoparser/csgoproto/Cargo.toml
      - run: cargo check --manifest-path vendor/demoparser/parser/Cargo.toml --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-rust-format.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `cargo test --workspace` above re-runs every ts-rs `export_bindings_*`
      # test, which rewrites apps/web/src/shared/desktop/generated/ from the
      # `#[derive(TS)]` types. If that leaves a diff, the checked-in TypeScript
      # no longer describes the Rust it was generated from.
      - name: wire types are in step with the Rust
        shell: bash
        run: |
          # --intent-to-add so a binding for a newly derived type, which is
          # untracked rather than modified, also shows up as a diff.
          git add --intent-to-add -- apps/web/src/shared/desktop/generated/
          if ! git diff --exit-code -- apps/web/src/shared/desktop/generated/; then
            echo
            echo "The Rust structures changed and the checked-in TypeScript bindings did not."
            echo "Run 'cargo test --workspace' locally, then commit the changes under"
            echo "apps/web/src/shared/desktop/generated/ together with the Rust change."
            echo "Never edit a file in that directory by hand: the next 'cargo test' overwrites it."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p vibe-cs-agent
      - run: pnpm demo-worker:sidecar
      - run: cargo test -p vibe-cs-desktop published_demo_worker_matches_the_build_manifest -- --ignored --nocapture
      - run: pnpm desktop:build
