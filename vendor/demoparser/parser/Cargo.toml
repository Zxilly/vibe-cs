[package]
name = "parser"
version = "0.1.1"
edition = "2021"

[features]
default = []
upstream-fixture-tests = []

[dependencies]
bitter = "0.9.1"
prost = "0.14.4"
snap = "1.1.2"
ahash = "0.8.12"
regex = "1.13.1"
phf = "0.14.0"
phf_macros = "0.14.0"
itertools = "0.15.0"
lazy_static = "1.5.1"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
rayon = "1.12.0"

[dependencies.csgoproto]
path = "../csgoproto"
[target.'cfg(not(target_env = "msvc"))'.dependencies]

[profile.dev]
overflow-checks = false

[profile.release]
debug = true

[workspace]
