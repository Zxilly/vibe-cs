[env]
FFMPEG_DIR = { value = ".deps/ffmpeg", relative = true }

# Ordinary Rust tests write ts-rs output below the workspace `target/` so a test
# run never rewrites the checked-in frontend contract. `pnpm bindings` overrides
# this with the canonical generated directory and is the only binding writer.
#
# `TS_RS_LARGE_INT` matters: without it `i64`/`u64` become `bigint`, and every
# tick, byte count and duration on the wire is one of those. They arrive as JSON
# numbers, so `number` is what they actually are.
TS_RS_EXPORT_DIR = { value = "target/ts-rs-test-output", relative = true }
TS_RS_LARGE_INT = "number"
