[workspace]
members = [
  "apps/desktop/src-tauri",
  "apps/demo-worker",
  "crates/application",
  "crates/agent",
  "crates/cosmetics",
  "crates/demo",
  "crates/domain",
  "crates/hlae",
  "crates/integrations",
  "crates/media",
  "crates/platform-windows",
  "crates/recording",
  "crates/runtime",
  "crates/source-assets",
  "crates/storage",
]
default-members = ["apps/desktop/src-tauri"]
exclude = [
  "vendor/demoparser/csgoproto",
  "vendor/demoparser/parser",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Vibe CS contributors"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
ahash = "0.8"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
bzip2 = "0.6"
bytes = "1.10"
cap-std = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
ez-ffmpeg = "0.17.1"
ffmpeg-next = "=8.1.0"
futures-util = "0.3"
fs4 = { version = "1.1.0", features = ["sync"] }
getrandom = "0.4"
hmac = "0.13"
hex = "0.4"
http = "1.3"
lz4_flex = "0.14"
mime_guess = "2.0"
notify = "8.0"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rig-agent = { version = "0.41.0", default-features = false }
rig-core = { version = "0.41.0", default-features = false, features = ["reqwest", "rustls"] }
rustfft = "6.4.1"
semver = "1.0"
rusqlite = { version = "0.40", features = ["backup", "bundled", "chrono"] }
same-file = "1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
steamlocate = "2.1.0"
tempfile = "3.20"
thiserror = "2.0"
texture2ddecoder = "0.1.2"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.17", features = ["serde", "v4"] }
walkdir = "2.5"
windows = "0.62.2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
