name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File vendor/demoparser/verify-manifest.ps1
      - run: cargo test --manifest-path vendor/demoparser/parser/Cargo.toml --lib
      - run: cargo test --manifest-path vendor/demoparser/csgoproto/Cargo.toml
      - run: cargo check --manifest-path vendor/demoparser/parser/Cargo.toml --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-rust-format.ps1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p vibe-cs-agent
      - run: pnpm demo-worker:sidecar
      - run: cargo test -p vibe-cs-desktop published_demo_worker_matches_the_build_manifest -- --ignored --nocapture
      - run: pnpm desktop:build
